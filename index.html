<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDLANDS: Combat System</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; color: #00ff00; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 5px;
            pointer-events: none; min-width: 260px;
        }
        .bar-container {
            width: 100%; height: 12px; background: #222; 
            border: 1px solid #555; margin-top: 3px; margin-bottom: 8px;
        }
        #health-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0000, #ff6666); transition: width 0.3s; }
        #stamina-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #00aaff, #66ddff); transition: width 0.2s; }
        #stamina-bar.low { background: linear-gradient(90deg, #ffaa00, #ffdd00); }
        #stamina-bar.empty { background: linear-gradient(90deg, #ff0000, #ff4444); }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #crosshair.aim { width: 20px; height: 20px; border-color: #ff4444; }
        #interaction-prompt {
            position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
            color: #ffff00; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px black;
            display: none; pointer-events: none; text-align: center;
        }
        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; cursor: pointer; text-align: center;
        }
        #notification {
            position: absolute; bottom: 20px; right: 20px; 
            background: rgba(0, 255, 0, 0.2); color: #00ff00;
            padding: 10px 20px; border-radius: 5px; border: 1px solid #00ff00;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
        #controls-help {
            position: absolute; bottom: 20px; left: 20px;
            color: #aaa; font-size: 12px; background: rgba(0,0,0,0.5);
            padding: 10px; border-radius: 5px; pointer-events: none;
        }
        #placement-status {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, 40px);
            font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black;
            display: none; pointer-events: none;
        }
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(transparent 30%, rgba(255,0,0,0.5));
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #alert-indicator {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            color: #ff0000; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 10px red; display: none;
            animation: pulse 0.5s infinite;
        }
        #sprint-indicator {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            color: #00ffff; font-size: 14px; font-weight: bold;
            text-shadow: 0 0 5px cyan; display: none;
            background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 3px;
        }
        #campfire-bonus {
            position: absolute; top: 10px; right: 10px;
            color: #ffaa00; font-size: 14px; font-weight: bold;
            text-shadow: 0 0 5px orange; display: none;
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 5px;
            border: 1px solid #ffaa00;
        }
        #weapon-hud {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 10px 15px; border-radius: 5px;
            border: 1px solid #555; pointer-events: none;
            min-width: 180px;
        }
        #weapon-hud .weapon-name { color: #ffaa00; font-weight: bold; font-size: 14px; }
        #weapon-hud .ammo { color: #00ff00; font-size: 18px; }
        #weapon-hud .hint { color: #888; font-size: 11px; margin-top: 5px; }
        .drone-hp-bar {
            position: absolute; width: 60px; height: 6px;
            background: #330000; border: 1px solid #ff0000;
            pointer-events: none; display: none;
        }
        .drone-hp-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6666);
            transition: width 0.2s;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3>WILDLANDS: LAST SIGNAL</h3>
        <p>❤️ HP: <span id="health-text">100</span>/100</p>
        <div class="bar-container"><div id="health-bar"></div></div>
        <p>⚡ Stamina: <span id="stamina-text">100
