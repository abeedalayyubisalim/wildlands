<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDLANDS: Crafting & Campfires</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; user-select: none; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; color: #00ff00; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 5px;
            pointer-events: none; min-width: 240px;
        }
        #ui-layer button {
            pointer-events: auto; background: #004400; color: #00ff00; 
            border: 1px solid #00ff00; padding: 5px 10px; margin-top: 5px;
            cursor: pointer; font-family: inherit; width: 100%;
        }
        #ui-layer button:disabled { background: #222; color: #555; border-color: #555; cursor: not-allowed; }
        #ui-layer button:hover:not(:disabled) { background: #006600; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #interaction-prompt {
            position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
            color: #ffff00; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 2px black;
            display: none; pointer-events: none;
        }
        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; cursor: pointer; text-align: center;
        }
        #notification {
            position: absolute; bottom: 20px; right: 20px; 
            background: rgba(0, 255, 0, 0.2); color: #00ff00;
            padding: 10px 20px; border-radius: 5px; border: 1px solid #00ff00;
            opacity: 0; transition: opacity 0.5s; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3>WILDLANDS: LAST SIGNAL</h3>
        <p>🎒 Inventory: <span id="inv-wood">0</span> Kayu</p>
        <p>🕒 Waktu: <span id="time">06:00</span> | <span id="period">Pagi</span></p>
        <p>📍 <span id="coords">0, 0, 0</span></p>
        <hr style="border-color: #004400;">
        <button id="btn-craft">🔥 Buat Api Unggun (5 Kayu)</button>
        <button id="btn-save">💾 Simpan Game</button>
        <button id="btn-load">🔄 Muat Game</button>
    </div>
    
    <div id="crosshair"></div>
    <div id="interaction-prompt">[E] Tebang Pohon</div>
    <div id="notification">Game Disimpan!</div>

    <div id="blocker">
        <h1>KLIK UNTUK MULAI</h1>
        <p>Gerak: W, A, S, D | Lompat: SPASI | Interaksi: E</p>
        <p>Tekan ESC untuk melepaskan kursor.</p>
        <p id="load-status" style="color: #ffff00; margin-top: 20px;">Memuat data...</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { createClient } from '@supabase/supabase-js';

        // --- 1. SUPABASE SETUP ---
        const supabaseUrl = 'https://mlsibwihfzehqcdawrdh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sc2lid2loZnplaHFjZGF3cmRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMTcwNTEsImV4cCI6MjEwMzY5MzA1MX0.faKWNZqTLE6nEH6nPw0L4uFepTy6ZvqrZDy2BaHcWxs';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let playerId = localStorage.getItem('wildlands_player_id');
        if (!playerId) {
            playerId = 'player_' + Math.random().toString(36).substring(2, 11);
            localStorage.setItem('wildlands_player_id', playerId);
        }

        // State Game
        let inventory = { wood: 0 };
        let choppedTrees = new Set();
        let campfires = []; // Array of {x, y, z}
        let isPlacingCampfire = false;

        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(2048, 2048);
        const d = 150;
        sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
        scene.add(sunLight);

        // --- 3. TERRAIN & AIR ---
        const worldSize = 300;
        const geometry = new THREE.PlaneGeometry(worldSize, worldSize, 150, 150);
        geometry.rotateX(-Math.PI / 2);
        const posAttribute = geometry.attributes.position;
        const colors = [];
        const colorObj = new THREE.Color();

        function getTerrainHeight(x, z) {
            let y = 0;
            y += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 4;
            y += Math.sin(x * 0.15 + 1) * Math.cos(z * 0.15) * 2;
            y += Math.sin(x * 0.3) * Math.cos(z * 0.3) * 0.5;
            return y;
        }

        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i), z = posAttribute.getZ(i);
            const y = getTerrainHeight(x, z);
            posAttribute.setY(i, y);
            if (y < -2) colorObj.setHex(0x2d4c1e);
            else if (y < 3) colorObj.setHex(0x4a7c2e);
            else if (y < 6) colorObj.setHex(0x6b6b6b);
            else colorObj.setHex(0xffffff);
            colors.push(colorObj.r, colorObj.g, colorObj.b);
        }
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, flatShading: true }));
        terrain.receiveShadow = true;
        terrain.name = 'terrain'; // Untuk raycasting
        scene.add(terrain);

        const waterLevel = -1.5;
        const waterGeo = new THREE.PlaneGeometry(worldSize * 2, worldSize * 2, 80, 80);
        waterGeo.rotateX(-Math.PI / 2);
        const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({ color: 0x1e6091, transparent: true, opacity: 0.75, roughness: 0.2, metalness: 0.6, flatShading: true }));
        water.position.y = waterLevel;
        scene.add(water);
        const waterPosAttr = waterGeo.attributes.position;
        const waterOriginalY = new Float32Array(waterPosAttr.count);
        for (let i = 0; i < waterPosAttr.count; i++) waterOriginalY[i] = waterPosAttr.getY(i);

        // --- 4. POHON (INSTANCED MESH) ---
        const treeCount = 800;
        const treeGeo = new THREE.ConeGeometry(1.5, 5, 6);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x1a3300, flatShading: true });
        const treeMesh = new THREE.InstancedMesh(treeGeo, treeMat, treeCount);
        treeMesh.castShadow = true; treeMesh.receiveShadow = true;
        treeMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        
        const dummy = new THREE.Object3D();
        for (let i = 0; i < treeCount; i++) {
            const x = (Math.random() - 0.5) * worldSize * 0.9;
            const z = (Math.random() - 0.5) * worldSize * 0.9;
            const y = getTerrainHeight(x, z);
            if (y > waterLevel + 0.5 && y < 4) {
                dummy.position.set(x, y + 2.5, z);
                dummy.scale.setScalar(0.8 + Math.random() * 0.6);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                treeMesh.setMatrixAt(i, dummy.matrix);
            } else {
                dummy.position.set(0, -100, 0); dummy.updateMatrix();
                treeMesh.setMatrixAt(i, dummy.matrix);
            }
        }
        scene.add(treeMesh);

        // --- 5. RAYCASTER & INTERAKSI ---
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);
        let targetInstanceId = null;

        // --- 6. CAMPFIRE SYSTEM ---
        const campfireGroup = new THREE.Group(); // Menyimpan semua api unggun yang dibangun
        scene.add(campfireGroup);
        let campfirePreview = null;

        function createCampfireMesh(isPreview = false) {
            const group = new THREE.Group();
            const logGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
            const logMat = new THREE.MeshStandardMaterial({ color: 0x4a3018 });
            
            // Susun kayu melingkar
            for(let i=0; i<4; i++) {
                const log = new THREE.Mesh(logGeo, logMat);
                log.rotation.z = Math.PI / 2;
                log.rotation.y = (i / 4) * Math.PI;
                log.castShadow = true; log.receiveShadow = true;
                group.add(log);
            }
            
            // Batu penyangga
            const stoneGeo = new THREE.DodecahedronGeometry(0.2);
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x555555, flatShading: true });
            for(let i=0; i<8; i++) {
                const stone = new THREE.Mesh(stoneGeo, stoneMat);
                const angle = (i / 8) * Math.PI * 2;
                stone.position.set(Math.cos(angle)*0.6, 0, Math.sin(angle)*0.6);
                stone.castShadow = true;
                group.add(stone);
            }

            // Api (Mesh + PointLight)
            if (!isPreview) {
                const fireGeo = new THREE.ConeGeometry(0.3, 0.8, 8);
                const fireMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 });
                const fire = new THREE.Mesh(fireGeo, fireMat);
                fire.position.y = 0.4;
                fire.name = 'fireMesh';
                group.add(fire);

                // CAHAYA DINAMIS
                const light = new THREE.PointLight(0xffaa00, 2, 15); // Warna, Intensitas, Jarak
                light.position.y = 0.5;
                light.castShadow = true;
                light.shadow.mapSize.set(512, 512);
                group.add(light);
            } else {
                group.traverse((child) => {
                    if (child.isMesh) child.material = child.material.clone();
                    if (child.isMesh) child.material.opacity = 0.5;
                    if (child.isMesh) child.material.transparent = true;
                });
            }

            return group;
        }

        function startPlacementMode() {
            if (isPlacingCampfire) return;
            isPlacingCampfire = true;
            campfirePreview = createCampfireMesh(true);
            scene.add(campfirePreview);
            document.getElementById('interaction-prompt').innerText = "KLIK KIRI untuk Letakkan | ESC untuk Batal";
            document.getElementById('interaction-prompt').style.display = 'block';
        }

        function placeCampfire(x, y, z) {
            const campfire = createCampfireMesh(false);
            campfire.position.set(x, y, z);
            campfireGroup.add(campfire);
            campfires.push({ x, y, z });
            
            // Cleanup preview
            scene.remove(campfirePreview);
            campfirePreview = null;
            isPlacingCampfire = false;
            document.getElementById('interaction-prompt').style.display = 'none';
            
            showNotification("🔥 Api Unggun Dibangun!");
            saveGame();
        }

        // --- 7. KONTROL PEMAIN ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const loadStatus = document.getElementById('load-status');
        const promptUI = document.getElementById('interaction-prompt');

        blocker.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => {
            blocker.style.display = 'flex';
            if (!isPlacingCampfire) promptUI.style.display = 'none';
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerHeight = 2.5;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) { velocity.y += 8; canJump = false; }
            if (e.code === 'KeyE' && targetInstanceId !== null && controls.isLocked && !isPlacingCampfire) {
                chopTree(targetInstanceId);
            }
            if (e.code === 'Escape' && isPlacingCampfire) {
                scene.remove(campfirePreview);
                campfirePreview = null;
                isPlacingCampfire = false;
                promptUI.style.display = 'none';
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // Klik Kiri untuk letakkan api unggun
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isPlacingCampfire && controls.isLocked) {
                raycaster.setFromCamera(center, camera);
                const intersects = raycaster.intersectObject(terrain);
                if (intersects.length > 0 && intersects[0].distance < 10) {
                    placeCampfire(intersects[0].point.x, intersects[0].point.y, intersects[0].point.z);
                } else {
                    showNotification("Terlalu jauh atau tidak valid!", true);
                }
            }
        });

        function chopTree(instanceId) {
            dummy.matrix.identity(); 
            treeMesh.setMatrixAt(instanceId, dummy.matrix);
            treeMesh.instanceMatrix.needsUpdate = true;

            choppedTrees.add(instanceId);
            inventory.wood += 1;
            updateUI();
            showNotification(`+1 Kayu! (Total: ${inventory.wood})`);
            targetInstanceId = null;
            promptUI.style.display = 'none';
            saveGame();
        }

        // --- 8. DAY/NIGHT CYCLE ---
        let timeOfDay = 8.0;
        const timeSpeed = 0.15;
        const skyColors = {
            night: new THREE.Color(0x0a0a2e), dawn: new THREE.Color(0xff8c42),
            day: new THREE.Color(0x87CEEB), dusk: new THREE.Color(0xff6b6b),
        };

        function getSkyColor(time) {
            if (time < 5) return skyColors.night;
            if (time < 7) return skyColors.night.clone().lerp(skyColors.dawn, (time - 5) / 2);
            if (time < 9) return skyColors.dawn.clone().lerp(skyColors.day, (time - 7) / 2);
            if (time < 17) return skyColors.day;
            if (time < 19) return skyColors.day.clone().lerp(skyColors.dusk, (time - 17) / 2);
            if (time < 21) return skyColors.dusk.clone().lerp(skyColors.night, (time - 19) / 2);
            return skyColors.night;
        }

        function getTimePeriod(time) {
            if (time < 5) return "Tengah Malam"; if (time < 7) return "Subuh";
            if (time < 11) return "Pagi"; if (time < 14) return "Siang";
            if (time < 17) return "Sore"; if (time < 19) return "Senja";
            if (time < 21) return "Maghrib"; return "Malam";
        }

        function formatTime(time) {
            const h = Math.floor(time) % 24, m = Math.floor((time - Math.floor(time)) * 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        scene.fog = new THREE.Fog(skyColors.day, 30, 180);
        scene.background = skyColors.day.clone();

        // --- 9. SAVE & LOAD SYSTEM ---
        function updateUI() {
            document.getElementById('inv-wood').innerText = inventory.wood || 0;
            const btnCraft = document.getElementById('btn-craft');
            if ((inventory.wood || 0) >= 5) {
                btnCraft.disabled = false;
                btnCraft.innerText = "🔥 Buat Api Unggun (5 Kayu)";
            } else {
                btnCraft.disabled = true;
                btnCraft.innerText = `🔥 Api Unggun (Butuh ${5 - (inventory.wood || 0)} Kayu)`;
            }
        }

        function showNotification(text, isError = false) {
            const notif = document.getElementById('notification');
            notif.innerText = text;
            notif.style.background = isError ? 'rgba(255, 0, 0, 0.2)' : 'rgba(0, 255, 0, 0.2)';
            notif.style.color = isError ? '#ff4444' : '#00ff00';
            notif.style.borderColor = isError ? '#ff4444' : '#00ff00';
            notif.style.opacity = 1;
            setTimeout(() => { notif.style.opacity = 0; }, 3000);
        }

        async function saveGame() {
            showNotification("Menyimpan...");
            const saveData = {
                player_id: playerId,
                pos_x: camera.position.x, pos_y: camera.position.y, pos_z: camera.position.z,
                time_of_day: timeOfDay,
                inventory: inventory,
                chopped_trees: Array.from(choppedTrees),
                campfires: campfires
            };

            const { error } = await supabase.from('players').upsert(saveData, { onConflict: 'player_id' });
            if (error) {
                console.error('Save error:', error);
                showNotification("Gagal menyimpan!", true);
            } else {
                showNotification("✅ Game Berhasil Disimpan!");
            }
        }

        async function loadGame() {
            showNotification("Memuat...");
            const { data, error } = await supabase.from('players').select('*').eq('player_id', playerId).single();

            if (data && !error) {
                camera.position.set(data.pos_x, data.pos_y, data.pos_z);
                timeOfDay = data.time_of_day || 8.0;
                
                if (data.inventory) {
                    inventory = data.inventory;
                }

                if (data.chopped_trees && Array.isArray(data.chopped_trees)) {
                    data.chopped_trees.forEach(id => {
                        choppedTrees.add(id);
                        dummy.matrix.identity();
                        treeMesh.setMatrixAt(id, dummy.matrix);
                    });
                    treeMesh.instanceMatrix.needsUpdate = true;
                }

                // Muat Api Unggun
                if (data.campfires && Array.isArray(data.campfires)) {
                    campfires = data.campfires;
                    campfires.forEach(pos => {
                        const campfire = createCampfireMesh(false);
                        campfire.position.set(pos.x, pos.y, pos.z);
                        campfireGroup.add(campfire);
                    });
                }

                showNotification("✅ Game Berhasil Dimuat!");
                loadStatus.innerText = "Data ditemukan! Klik untuk mulai.";
                updateUI();
                return true;
            } else {
                loadStatus.innerText = "Data tidak ditemukan. Memulai game baru.";
                camera.position.set(0, getTerrainHeight(0, 0) + playerHeight, 0);
                updateUI();
                return false;
            }
        }

        document.getElementById('btn-save').addEventListener('click', (e) => { e.stopPropagation(); saveGame(); });
        document.getElementById('btn-load').addEventListener('click', (e) => { e.stopPropagation(); loadGame(); });
        document.getElementById('btn-craft').addEventListener('click', (e) => { 
            e.stopPropagation(); 
            if ((inventory.wood || 0) >= 5) {
                inventory.wood -= 5;
                updateUI();
                startPlacementMode();
            }
        });
        
        setInterval(() => { if (controls.isLocked) saveGame(); }, 30000);

        // --- 10. GAME LOOP ---
        let prevTime = performance.now();

        loadGame().then(() => {
            const terrainY = getTerrainHeight(camera.position.x, camera.position.z);
            if (camera.position.y < terrainY + playerHeight) camera.position.y = terrainY + playerHeight;
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            // Update Waktu & Cahaya
            timeOfDay += timeSpeed * delta;
            if (timeOfDay >= 24) timeOfDay -= 24;
            const currentSkyColor = getSkyColor(timeOfDay);
            scene.background = currentSkyColor;
            scene.fog.color = currentSkyColor;

            const sunAngle = ((timeOfDay - 6) / 24) * Math.PI * 2;
            sunLight.position.set(Math.cos(sunAngle) * 200, Math.sin(sunAngle) * 200, 50);
            sunLight.lookAt(0, 0, 0);
            const sunHeight = Math.sin(sunAngle);
            sunLight.intensity = sunHeight > 0 ? (0.5 + sunHeight * 0.8) : 0.1;
            sunLight.color.setHex(sunHeight > 0.3 ? 0xffffff : 0xffaa66);
            ambientLight.intensity = sunHeight > 0 ? (0.3 + sunHeight * 0.3) : 0.15;

            // Animasi Air
            const waveTime = time * 0.001;
            for (let i = 0; i < waterPosAttr.count; i++) {
                const x = waterPosAttr.getX(i), z = waterPosAttr.getZ(i);
                waterPosAttr.setY(i, waterOriginalY[i] + Math.sin(x * 0.1 + waveTime) * 0.15 + Math.cos(z * 0.1 + waveTime * 0.8) * 0.15);
            }
            waterPosAttr.needsUpdate = true;
            waterGeo.computeVertexNormals();

            // Animasi Api Unggun (Flicker / Kedip)
            const flicker = Math.sin(time * 0.05) * 0.2 + Math.random() * 0.2;
            campfireGroup.children.forEach(campfire => {
                campfire.children.forEach(child => {
                    if (child.isLight) child.intensity = 1.5 + flicker;
                    if (child.name === 'fireMesh') child.scale.y = 1 + flicker * 0.5;
                });
            });

            // Logika Pemain & Raycasting
            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 80.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                const terrainY = getTerrainHeight(camera.position.x, camera.position.z);
                const groundLevel = Math.max(terrainY, waterLevel);
                camera.position.y += velocity.y * delta;

                if (camera.position.y < groundLevel + playerHeight) {
                    velocity.y = 0;
                    camera.position.y = groundLevel + playerHeight;
                    canJump = true;
                }

                // RAYCASTING
                raycaster.setFromCamera(center, camera);

                if (isPlacingCampfire && campfirePreview) {
                    // Raycast ke tanah untuk penempatan
                    const intersects = raycaster.intersectObject(terrain);
                    if (intersects.length > 0 && intersects[0].distance < 10) {
                        campfirePreview.position.copy(intersects[0].point);
                        campfirePreview.position.y += 0.1; // Sedikit di atas tanah
                        campfirePreview.visible = true;
                    } else {
                        campfirePreview.visible = false;
                    }
                } else {
                    // Raycast ke pohon
                    const intersects = raycaster.intersectObject(treeMesh);
                    if (intersects.length > 0 && intersects[0].distance < 6) {
                        const instanceId = intersects[0].instanceId;
                        if (!choppedTrees.has(instanceId)) {
                            targetInstanceId = instanceId;
                            promptUI.innerText = "[E] Tebang Pohon";
                            promptUI.style.display = 'block';
                        } else {
                            targetInstanceId = null;
                            promptUI.style.display = 'none';
                        }
                    } else {
                        targetInstanceId = null;
                        if (!isPlacingCampfire) promptUI.style.display = 'none';
                    }
                }

                // Update UI
                document.getElementById('coords').innerText = `${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;
                document.getElementById('time').innerText = formatTime(timeOfDay);
                document.getElementById('period').innerText = getTimePeriod(timeOfDay);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
