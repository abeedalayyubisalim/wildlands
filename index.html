<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDLANDS: Open World Terrain</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; color: #00ff00; 
            background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 5px;
            pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            border: 1px solid black;
        }
        #blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; cursor: pointer; text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h3>WILDLANDS: LAST SIGNAL</h3>
        <p>Biome: <span id="biome">Unknown</span></p>
        <p>Koordinat: <span id="coords">0, 0, 0</span></p>
    </div>
    <div id="crosshair"></div>

    <div id="blocker">
        <h1>KLIK UNTUK MULAI EKSPLORASI</h1>
        <p>Gerak: W, A, S, D | Lompat: SPASI | Lihat: Mouse</p>
        <p>Tekan ESC untuk melepaskan kursor.</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SETUP DASAR ---
        const scene = new THREE.Scene();
        // Fog yang lebih tebal untuk menyembunyikan batas peta dan memberi kesan dunia luas
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 150); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- 2. PENCAHAYAAN ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 500;
        dirLight.shadow.camera.left = -150;
        dirLight.shadow.camera.right = 150;
        dirLight.shadow.camera.top = 150;
        dirLight.shadow.camera.bottom = -150;
        scene.add(dirLight);

        // --- 3. GENERASI TERRAIN PROSEDURAL ---
        const worldSize = 300;
        const segments = 150; // Semakin tinggi, semakin halus (tapi lebih berat)
        const geometry = new THREE.PlaneGeometry(worldSize, worldSize, segments, segments);
        geometry.rotateX(-Math.PI / 2);

        const posAttribute = geometry.attributes.position;
        const colors = [];
        const colorObj = new THREE.Color();

        // Fungsi untuk mendapatkan ketinggian (Y) berdasarkan koordinat X dan Z
        // Menggunakan layered sine waves untuk simulasi Fractal Brownian Motion (fBM) sederhana
        function getTerrainHeight(x, z) {
            let y = 0;
            y += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 4;       // Bukit besar
            y += Math.sin(x * 0.15 + 1) * Math.cos(z * 0.15) * 2;   // Bukit sedang
            y += Math.sin(x * 0.3) * Math.cos(z * 0.3) * 0.5;       // Detail kecil
            return y;
        }

        // Generate vertex positions dan colors
        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i);
            const z = posAttribute.getZ(i);
            const y = getTerrainHeight(x, z);
            
            posAttribute.setY(i, y);

            // Pewarnaan berdasarkan ketinggian (Vertex Colors)
            if (y < -2) {
                colorObj.setHex(0x2d4c1e); // Hijau tua (Lembah dalam)
            } else if (y < 3) {
                colorObj.setHex(0x4a7c2e); // Hijau rumput (Dataran)
            } else if (y < 6) {
                colorObj.setHex(0x6b6b6b); // Abu-abu (Batu/Pegunungan)
            } else {
                colorObj.setHex(0xffffff); // Putih (Salju di puncak)
            }
            colors.push(colorObj.r, colorObj.g, colorObj.b);
        }

        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({ 
            vertexColors: true, // Gunakan warna yang kita hitung di atas
            roughness: 0.8,
            metalness: 0.1,
            flatShading: true // Memberikan efek "low poly" yang artistik dan performa lebih baik
        });

        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        scene.add(terrain);

        // --- 4. OBJEK LINGKUNGAN (POHON SEDERHANA) ---
        // Menggunakan InstancedMesh untuk performa tinggi (merender 1000+ pohon dengan 1 draw call)
        const treeCount = 800;
        const treeGeo = new THREE.ConeGeometry(1.5, 5, 6);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x1a3300, flatShading: true });
        const treeMesh = new THREE.InstancedMesh(treeGeo, treeMat, treeCount);
        treeMesh.castShadow = true;
        treeMesh.receiveShadow = true;

        const dummy = new THREE.Object3D();
        let treeIndex = 0;

        for (let i = 0; i < treeCount; i++) {
            const x = (Math.random() - 0.5) * worldSize * 0.9;
            const z = (Math.random() - 0.5) * worldSize * 0.9;
            const y = getTerrainHeight(x, z);

            // Hanya taruh pohon di area dataran rendah/sedang (bukan di air/salju)
            if (y > -3 && y < 4) {
                dummy.position.set(x, y + 2.5, z); // +2.5 agar setengah badan pohon masuk ke tanah
                dummy.scale.setScalar(0.8 + Math.random() * 0.6); // Variasi ukuran
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.updateMatrix();
                treeMesh.setMatrixAt(treeIndex++, dummy.matrix);
            }
        }
        treeMesh.count = treeIndex; // Update jumlah pohon yang sebenarnya dirender
        scene.add(treeMesh);

        // --- 5. KONTROL PEMAIN & FISIKA ---
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');

        blocker.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'flex');

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerHeight = 2.5; // Tinggi mata pemain dari tanah

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) { velocity.y += 8; canJump = false; } break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // --- 6. GAME LOOP ---
        let prevTime = performance.now();
        const coordsDisplay = document.getElementById('coords');
        const biomeDisplay = document.getElementById('biome');

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1); // Cap delta untuk mencegah glitch

            if (controls.isLocked) {
                // Gesekan
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta; // Gravitasi

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 80.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Update posisi Y berdasarkan ketinggian terrain di posisi X, Z pemain saat ini
                const terrainY = getTerrainHeight(camera.position.x, camera.position.z);
                
                camera.position.y += velocity.y * delta;

                // Deteksi tanah
                if (camera.position.y < terrainY + playerHeight) {
                    velocity.y = 0;
                    camera.position.y = terrainY + playerHeight;
                    canJump = true;
                }

                // Update UI
                coordsDisplay.innerText = `${Math.round(camera.position.x)}, ${Math.round(camera.position.y)}, ${Math.round(camera.position.z)}`;
                
                // Deteksi Biome sederhana berdasarkan ketinggian
                if (terrainY > 6) biomeDisplay.innerText = "Pegunungan Bersalju (Dingin)";
                else if (terrainY > 3) biomeDisplay.innerText = "Dataran Tinggi Berbatu";
                else if (terrainY > -2) biomeDisplay.innerText = "Hutan / Dataran Rumput";
                else biomeDisplay.innerText = "Lembah Sungai (Basah)";
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Set posisi awal di tengah
        camera.position.set(0, getTerrainHeight(0, 0) + playerHeight, 0);
        animate();
    </script>
</body>
</html>
