<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WILDLANDS: LAST SIGNAL - Planet</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#0f0}
#hud{position:fixed;top:8px;left:8px;background:rgba(0,0,0,0.55);padding:6px 10px;font-size:13px;z-index:10;border:1px solid #0f03}
#crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border:1px solid #fff;border-radius:50%;z-index:9;pointer-events:none}
#blocker{position:fixed;inset:0;background:rgba(0,0,0,0.75);color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:20;text-align:center;gap:10px}
#blocker p{margin:0;font-size:14px;color:#aaa}
#health-wrap{position:fixed;bottom:10px;left:8px;z-index:10;font-size:11px}
#health-bar{width:180px;height:14px;border:1px solid #0f06;background:rgba(0,0,0,0.5);margin-top:2px}
#health-fill{height:100%;background:linear-gradient(90deg,#ff3b3b,#ff8a3b);width:100%;transition:width 0.15s}
#boss-hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:11;display:none;text-align:center;font-size:11px;color:#f88}
#boss-hp-bar-wrap{width:320px;height:12px;border:1px solid #f008;background:rgba(0,0,0,0.55);margin-top:2px}
#boss-hp-fill{height:100%;background:linear-gradient(90deg,#ff2222,#aa0000);width:100%;transition:width 0.15s}
#notify{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:11;color:#ffd;font-size:13px;text-align:center;text-shadow:0 0 4px #000;pointer-events:none}
#minimap-wrap{position:fixed;top:8px;right:8px;z-index:10;text-align:center}
#minimap{border-radius:50%;background:rgba(0,0,0,0.3)}
#minimap-legend{font-size:9px;color:#9d9;margin-top:2px;opacity:0.8}
</style>
</head>
<body>
<div id="hud"></div>
<div id="crosshair"></div>
<div id="health-wrap">HP<div id="health-bar"><div id="health-fill"></div></div></div>
<div id="boss-hud">👹 DRONE INDUK<div id="boss-hp-bar-wrap"><div id="boss-hp-fill"></div></div></div>
<div id="notify"></div>
<div id="minimap-wrap">
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="minimap-legend">hijau: desa/kota/gua/air terjun &nbsp;|&nbsp; merah: drone</div>
</div>
<div id="blocker">
  <div>WILDLANDS: LAST SIGNAL</div>
  <div style="font-size:14px;color:#8f8">🌍 Planet Edition</div>
  <p>[ KLIK UNTUK MULAI ]</p>
  <p>WASD gerak | Mouse lihat sekeliling | SPACE lompat | SHIFT lari | Klik kiri tembak | K simpan</p>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
  "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
}}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
